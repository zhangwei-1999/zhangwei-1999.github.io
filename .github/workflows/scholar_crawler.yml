name: Update archived Scholar data manually

# Optional legacy data maintenance. The site does not fetch Scholar on page load.
# Sitemap generation now belongs to the static site build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional crawler dependencies
        run: python -m pip install scholarly setuptools
      - name: Update Scholar data
        working-directory: scripts
        run: python scholar_crawler.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- scripts/scholar.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/scholar.json
          git commit -m "Update archived Scholar data"
          git push
